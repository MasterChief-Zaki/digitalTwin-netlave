name: Validate digital twin
on:
  pull_request:
    branches: [main, epic/digital-twin]
  push:
    branches: [main, epic/digital-twin]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm backend:setup
      - run: pnpm test:backend
      - run: pnpm exec node scripts/check-fiber-timer.mjs
      - run: pnpm lint
      - run: pnpm lint:styles
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
